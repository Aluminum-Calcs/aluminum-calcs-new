<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/scss/main.scss" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>glass-packer</title>
</head>
<body>
<div id="app">
  <header>
    <div class="header_content">

      <div class="logo">
        <span>Aluminum Calcs</span>
        <span>Rectangle Packer</span>
      </div>

    </div>
  </header>

  <main>

    <section class="hero">
      <h1>Sheet Optimizer</h1>

      <p>
        Optimize aluminum, glass, plywood and ACP sheet cutting layouts.
      </p>
    </section>

    <section class="controls">

      <div class="sheet-inputs">

        <h2>Sheet Size</h2>

        <input
          type="number"
          id="sheet-width"
          placeholder="Width (mm)"
          value="3300"
        >

        <input
          type="number"
          id="sheet-height"
          placeholder="Height (mm)"
          value="2140"
        >

      </div>

      <div class="piece-inputs">

        <h2>Add Piece</h2>

        <input
          type="number"
          id="piece-width"
          placeholder="Width"
        >

        <input
          type="number"
          id="piece-height"
          placeholder="Height"
        >

        <input
          type="number"
          id="piece-qty"
          placeholder="Quantity"
          value="1"
        >

        <button id="add-piece">
          Add Piece
        </button>

      </div>

      <ul id="piece-list"></ul>

      <div class="options">

        <label>
          <input type="checkbox" id="rotation" checked>
          Allow Rotation
        </label>

        <label>
          Kerf / Spacing
          <input
            type="number"
            id="spacing"
            value="5"
          >
        </label>

        <label>
          Edge trim (mm)
          <input type="number" id="trim" value="10">
        </label>

        <label>
          <input type="checkbox" id="piece-lock">
          Don't rotate (grain direction)
        </label>

      </div>

      <button id="pack-btn">
        Generate Layout
      </button>

    </section>

    <section class="stats">

      <div>
        <span>Sheets Used:</span>
        <strong id="sheet-count">0</strong>
      </div>

      <div>
        <span>Efficiency:</span>
        <strong id="efficiency">0%</strong>
      </div>

      <div>
        <span>Waste:</span>
        <strong id="waste">0%</strong>
      </div>

    </section>

    <section class="canvas-wrapper">

      <canvas id="packer-canvas"></canvas>

    </section>

  </main>
</div>
<script type="module" src="/src/js/sheet-optimizer/guillotine.js"></script>
<script type="module" src="/src/js/sheet-optimizer/logic.js"></script>
</body>
</html>
